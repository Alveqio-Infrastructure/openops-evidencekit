name: OpenOps Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenOps EvidenceKit
        run: python -m pip install git+https://github.com/Alveqio-Infrastructure/openops-evidencekit.git
      - name: Evaluate evidence
        run: |
          openops-evidence questionnaire policy __OPENOPS_POLICY_FILE__ -o evidence-questionnaire.md
          openops-evidence validate -i evidence.sample.json
          openops-evidence inventory evidence -i evidence.sample.json -o inventory.md
          openops-evidence evidence quality -i evidence.sample.json -f json -o quality-report.json
          openops-evidence validate -i quality-report.json -t quality-report
          openops-evidence evidence quality -i evidence.sample.json -o quality-report.md
          openops-evidence evidence completeness -i evidence.sample.json -p __OPENOPS_POLICY_FILE__ -f json -o completeness-report.json
          openops-evidence validate -i completeness-report.json -t completeness-report
          openops-evidence evidence completeness -i evidence.sample.json -p __OPENOPS_POLICY_FILE__ -o completeness-report.md
          openops-evidence catalog validate service-catalog.sample.toml
          openops-evidence catalog report -i evidence.sample.json -c service-catalog.sample.toml -f json -o service-catalog.json || true
          openops-evidence validate -i service-catalog.json -t service-catalog
          openops-evidence catalog report -i evidence.sample.json -c service-catalog.sample.toml -o service-catalog.md || true
          openops-evidence runbook report -i evidence.sample.json -c service-catalog.sample.toml --max-age-days 365 -f json -o runbook-report.json
          openops-evidence validate -i runbook-report.json -t runbook-report
          openops-evidence runbook report -i evidence.sample.json -c service-catalog.sample.toml --max-age-days 365 -o runbook-report.md
          openops-evidence freshness report -i evidence.sample.json --max-age-days 30 -f json -o freshness-report.json
          openops-evidence validate -i freshness-report.json -t freshness-report
          openops-evidence freshness report -i evidence.sample.json --max-age-days 30 -o freshness-report.md
          openops-evidence restore report -i evidence.sample.json --max-drill-age-days 90 -f json -o restore-report.json
          openops-evidence validate -i restore-report.json -t restore-report
          openops-evidence restore report -i evidence.sample.json --max-drill-age-days 90 -o restore-report.md
          openops-evidence mail report -i evidence.sample.json -f json -o mail-report.json
          openops-evidence validate -i mail-report.json -t mail-report
          openops-evidence mail report -i evidence.sample.json -o mail-report.md
          openops-evidence tls report -i evidence.sample.json -f json -o tls-report.json
          openops-evidence validate -i tls-report.json -t tls-report
          openops-evidence tls report -i evidence.sample.json -o tls-report.md
          openops-evidence access report -i evidence.sample.json -f json -o access-report.json
          openops-evidence validate -i access-report.json -t access-report
          openops-evidence access report -i evidence.sample.json -o access-report.md
          openops-evidence monitoring report -i evidence.sample.json -f json -o monitoring-report.json
          openops-evidence validate -i monitoring-report.json -t monitoring-report
          openops-evidence monitoring report -i evidence.sample.json -o monitoring-report.md
          openops-evidence exposure report -i evidence.sample.json -f json -o exposure-report.json
          openops-evidence validate -i exposure-report.json -t exposure-report
          openops-evidence exposure report -i evidence.sample.json -o exposure-report.md
          openops-evidence firewall report -i evidence.sample.json -f json -o firewall-report.json
          openops-evidence validate -i firewall-report.json -t firewall-report
          openops-evidence firewall report -i evidence.sample.json -o firewall-report.md
          openops-evidence patch report -i evidence.sample.json -f json -o patch-report.json
          openops-evidence validate -i patch-report.json -t patch-report
          openops-evidence patch report -i evidence.sample.json -o patch-report.md
          openops-evidence vulnerability report -i evidence.sample.json -f json -o vulnerability-report.json
          openops-evidence validate -i vulnerability-report.json -t vulnerability-report
          openops-evidence vulnerability report -i evidence.sample.json -o vulnerability-report.md
          openops-evidence software report -i evidence.sample.json -f json -o software-inventory-report.json
          openops-evidence validate -i software-inventory-report.json -t software-inventory-report
          openops-evidence software report -i evidence.sample.json -o software-inventory-report.md
          openops-evidence runtime report -i evidence.sample.json -f json -o runtime-report.json
          openops-evidence validate -i runtime-report.json -t runtime-report
          openops-evidence runtime report -i evidence.sample.json -o runtime-report.md
          openops-evidence service-level report -i evidence.sample.json -c service-catalog.sample.toml -f json -o service-level-report.json
          openops-evidence validate -i service-level-report.json -t service-level-report
          openops-evidence service-level report -i evidence.sample.json -c service-catalog.sample.toml -o service-level-report.md
          openops-evidence incident report -i evidence.sample.json -c service-catalog.sample.toml -f json -o incident-report.json
          openops-evidence validate -i incident-report.json -t incident-report
          openops-evidence incident report -i evidence.sample.json -c service-catalog.sample.toml -o incident-report.md
          openops-evidence coverage report -i evidence.sample.json -p __OPENOPS_POLICY_FILE__ -o policy-coverage.md
          openops-evidence check -i evidence.sample.json -p __OPENOPS_POLICY_FILE__ -o report.openops.json || true
          openops-evidence validate -i report.openops.json -t report
          openops-evidence badge report -i report.openops.json -o readiness-badge.json
          openops-evidence brief report -i report.openops.json -o executive-brief.md
          openops-evidence risk register -i report.openops.json -f markdown -o risk-register.md
          openops-evidence risk register -i report.openops.json -o risk-register.json
          openops-evidence validate -i risk-register.json -t risk-register
          openops-evidence scorecard report -i report.openops.json -o scorecard.md
          openops-evidence scorecard report -i report.openops.json -f html -o scorecard.html
          openops-evidence history append -i report.openops.json --source github-actions -o readiness-history.json
          openops-evidence history render -i readiness-history.json -f markdown -o readiness-history.md
          openops-evidence history render -i readiness-history.json -f svg -o readiness-history.svg
          openops-evidence report -i report.openops.json -f markdown -o report.openops.md
          openops-evidence report -i report.openops.json -f junit -o report.openops.junit.xml
          openops-evidence report -i report.openops.json -f sarif -o report.openops.sarif.json
          openops-evidence report -i report.openops.json -f prometheus -o report.openops.prom
          openops-evidence review create -i evidence.sample.json -p __OPENOPS_POLICY_FILE__ --catalog service-catalog.sample.toml -o review-pack --archive review-pack.zip --min-score 90 --max-warnings 0
          openops-evidence validate -i review-pack/review-checklist.json -t review-checklist
          openops-evidence gate report -i report.openops.json --min-score 90 --max-warnings 0 -o gate-result.json
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openops-evidence
          path: |
            evidence-questionnaire.md
            report.openops.json
            inventory.md
            quality-report.json
            quality-report.md
            completeness-report.json
            completeness-report.md
            service-catalog.json
            service-catalog.md
            runbook-report.json
            runbook-report.md
            freshness-report.json
            freshness-report.md
            restore-report.json
            restore-report.md
            mail-report.json
            mail-report.md
            tls-report.json
            tls-report.md
            access-report.json
            access-report.md
            monitoring-report.json
            monitoring-report.md
            exposure-report.json
            exposure-report.md
            firewall-report.json
            firewall-report.md
            patch-report.json
            patch-report.md
            vulnerability-report.json
            vulnerability-report.md
            software-inventory-report.json
            software-inventory-report.md
            runtime-report.json
            runtime-report.md
            service-level-report.json
            service-level-report.md
            incident-report.json
            incident-report.md
            policy-coverage.md
            report.openops.md
            report.openops.junit.xml
            report.openops.sarif.json
            report.openops.prom
            readiness-badge.json
            executive-brief.md
            risk-register.json
            risk-register.md
            scorecard.md
            scorecard.html
            readiness-history.json
            readiness-history.md
            readiness-history.svg
            gate-result.json
            review-pack.zip
            review-pack/**
