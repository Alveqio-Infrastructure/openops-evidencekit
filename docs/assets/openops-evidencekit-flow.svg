<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenOps EvidenceKit workflow</title>
  <desc id="desc">A workflow diagram showing collectors, evidence, policies, reports, action plans, and signed bundles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0.04em; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#shadow); }
      .accent-a { fill: #0f766e; }
      .accent-b { fill: #2563eb; }
      .accent-c { fill: #b45309; }
      .accent-d { fill: #7c3aed; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text x="70" y="70" class="label">OpenOps EvidenceKit</text>
  <text x="70" y="100" class="small">Deterministic infrastructure evidence for reviews, CI, handoff, and remediation.</text>

  <rect x="70" y="155" width="210" height="160" rx="14" class="card"/>
  <circle cx="112" cy="205" r="22" class="accent-a"/>
  <path d="M101 205h22M112 194v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="258" class="label">Collect</text>
  <text x="100" y="285" class="small">backup, TLS, docs,</text>
  <text x="100" y="308" class="small">monitoring, runtime</text>

  <rect x="355" y="155" width="210" height="160" rx="14" class="card"/>
  <circle cx="397" cy="205" r="22" class="accent-b"/>
  <path d="M386 205h22M386 214h22M386 196h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="385" y="258" class="label">Evaluate</text>
  <text x="385" y="285" class="small">schema validation</text>
  <text x="385" y="308" class="small">and policy checks</text>

  <rect x="640" y="155" width="210" height="160" rx="14" class="card"/>
  <circle cx="682" cy="205" r="22" class="accent-c"/>
  <path d="M672 215l9-21 12 21" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="258" class="label">Report</text>
  <text x="670" y="285" class="small">JSON, Markdown,</text>
  <text x="670" y="308" class="small">HTML, comparison</text>

  <rect x="925" y="155" width="210" height="160" rx="14" class="card"/>
  <circle cx="967" cy="205" r="22" class="accent-d"/>
  <path d="M956 205l8 8 16-18" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="955" y="258" class="label">Act</text>
  <text x="955" y="285" class="small">action plans and</text>
  <text x="955" y="308" class="small">signed bundles</text>

  <path d="M285 235h60" class="line"/>
  <path d="M570 235h60" class="line"/>
  <path d="M855 235h60" class="line"/>

  <rect x="120" y="385" width="960" height="64" rx="12" fill="#0f172a"/>
  <text x="155" y="424" class="tiny" fill="#cbd5e1">NO AGENT MAGIC IN THE CHECKS</text>
  <text x="390" y="424" class="small" fill="#f8fafc">Plain evidence files, auditable policy rules, repeatable outputs, safe sharing.</text>
</svg>
