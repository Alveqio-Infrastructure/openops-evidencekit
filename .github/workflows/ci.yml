name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Run sample workflow
        run: |
          PYTHONPATH=src python -m openops_evidence collect fixture examples/evidence.sample.json -o evidence.local.json
          PYTHONPATH=src python -m openops_evidence collect restic-snapshots examples/restic.snapshots.sample.json -o restic.evidence.json
          PYTHONPATH=src python -m openops_evidence collect borg-archives examples/borg.archives.sample.json -o borg.evidence.json
          PYTHONPATH=src python -m openops_evidence collect uptime-kuma examples/uptime-kuma.export.sample.json -o uptime-kuma.evidence.json
          PYTHONPATH=src python -m openops_evidence collect prometheus-targets examples/prometheus.targets.sample.json -o prometheus.evidence.json
          PYTHONPATH=src python -m openops_evidence collect systemd-timers examples/systemd.timers.sample.json -o systemd.evidence.json
          PYTHONPATH=src python -m openops_evidence collect docker-containers examples/docker.containers.sample.jsonl -o docker.evidence.json
          PYTHONPATH=src python -m openops_evidence collect docs examples/docs-sample --required inventory.md --required runbooks/backup-restore.md --max-age-days 365 -o docs.evidence.json
          PYTHONPATH=src python -m openops_evidence merge evidence.local.json examples/evidence.tls.sample.json restic.evidence.json borg.evidence.json uptime-kuma.evidence.json prometheus.evidence.json systemd.evidence.json docker.evidence.json docs.evidence.json -o evidence.merged.json
          PYTHONPATH=src python -m openops_evidence redact -i evidence.merged.json --redact-hostnames -o evidence.redacted.json
          PYTHONPATH=src python -m openops_evidence validate -i evidence.local.json
          PYTHONPATH=src python -m openops_evidence validate -i docs.evidence.json
          PYTHONPATH=src python -m openops_evidence validate -i evidence.redacted.json
          PYTHONPATH=src python -m openops_evidence check -i evidence.local.json -p examples/policy.baseline.toml -o report.local.json
          PYTHONPATH=src python -m openops_evidence check -i docs.evidence.json -p examples/policy.documentation.toml -o report.docs.json
          PYTHONPATH=src python -m openops_evidence validate -i report.local.json -t report
          PYTHONPATH=src python -m openops_evidence report -i report.local.json -f markdown -o report.local.md
          PYTHONPATH=src python -m openops_evidence report -i report.local.json -f bookstack -o readiness.bookstack.md
          PYTHONPATH=src python -m openops_evidence bundle manifest evidence.redacted.json report.local.json report.docs.json report.local.md readiness.bookstack.md -o evidence-bundle.manifest.json
          PYTHONPATH=src python -m openops_evidence validate -i evidence-bundle.manifest.json -t bundle
