name: Bug report
description: Report incorrect behavior in OpenOps EvidenceKit.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic evidence. Do not include secrets, customer data, private hostnames, or private IPs.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I did not include secrets, real customer data, private hostnames, or private IP addresses.
          required: true
